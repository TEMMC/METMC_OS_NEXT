plugins {
    id 'com.android.application'
}

android {
    namespace 'com.metmc.os.next'
    compileSdk 36

    defaultConfig {
        applicationId 'com.metmc.os.next'
        minSdk 31
        targetSdk 36
        versionCode ((System.getenv('GITHUB_RUN_NUMBER') ?: '4') as Integer)
        versionName '1.2.1'
    }

    signingConfigs {
        release {
            storeFile rootProject.file('metmc-release.jks')
            if (System.getenv('METMC_KEYSTORE_PASSWORD') == null || System.getenv('METMC_KEY_ALIAS') == null || System.getenv('METMC_KEY_PASSWORD') == null) { throw new GradleException('Missing release signing credentials') }
            storePassword System.getenv('METMC_KEYSTORE_PASSWORD')
            keyAlias System.getenv('METMC_KEY_ALIAS')
            keyPassword System.getenv('METMC_KEY_PASSWORD')
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

// ProfileInstaller is optional for METMC OS NEXT. Exclude it completely so
// its background initializer cannot crash the process on the target device.
configurations.configureEach {
    exclude group: 'androidx.profileinstaller', module: 'profileinstaller'
}

// Keep the current MainActivity source compatible with the stable app-discovery
// implementation already present on main. The declaration was accidentally
// dropped in an earlier patch; repair it before Java compilation without
// changing unrelated source files.
tasks.register('patchMainActivitySource') {
    doLast {
        def source = file('src/main/java/com/metmc/os/next/MainActivity.java')
        def text = source.getText('UTF-8')
        def oldBlock = '''    ArrayList<ResolveInfo> getAndroidApps() {
        PackageManager pm = getPackageManager();
        LinkedHashMap<String,ResolveInfo> found = new LinkedHashMap<>();
        launcher.addCategory(Intent.CATEGORY_LAUNCHER);'''
        def newBlock = '''    ArrayList<ResolveInfo> getAndroidApps() {
        PackageManager pm = getPackageManager();
        LinkedHashMap<String,ResolveInfo> found = new LinkedHashMap<>();
        Intent launcher = new Intent(Intent.ACTION_MAIN);
        launcher.addCategory(Intent.CATEGORY_LAUNCHER);'''
        if (!text.contains('Intent launcher = new Intent(Intent.ACTION_MAIN);')) {
            if (!text.contains(oldBlock)) {
                throw new GradleException('MainActivity getAndroidApps source pattern was not found')
            }
            source.write(text.replace(oldBlock, newBlock), 'UTF-8')
        }
    }
}

tasks.named('preBuild') {
    dependsOn('patchMainActivitySource')
}

dependencies {
    implementation 'androidx.core:core:1.17.0'
    implementation 'androidx.concurrent:concurrent-futures:1.3.0'
    implementation 'com.termux.termux-app:terminal-view:0.118.0'
    implementation 'com.google.guava:listenablefuture:9999.0-empty-to-avoid-conflict-with-guava'
}
