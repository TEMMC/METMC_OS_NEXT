plugins {
    id 'com.android.application'
}

android {
    namespace 'com.metmc.os.next'
    compileSdk 36

    defaultConfig {
        applicationId 'com.metmc.os.next'
        minSdk 31
        targetSdk 36
        versionCode 4
        versionName '1.2.0'
    }

    signingConfigs {
        release {
            storeFile rootProject.file('metmc-release.jks')
            storePassword System.getenv('METMC_KEYSTORE_PASSWORD')
            keyAlias System.getenv('METMC_KEY_ALIAS')
            keyPassword System.getenv('METMC_KEY_PASSWORD')
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.17.0'
}
