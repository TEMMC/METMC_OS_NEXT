name: Apply METMC terminal and scrolling patch
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !startsWith(github.event.head_commit.message, '[METMC AUTO PATCH]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch source
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/metmc/os/next/MetmcTerminalPanel.java')
          s=p.read_text()
          start=s.index('    public void start(){')
          end=s.index('\n    private void showKeyboard()', start)
          new=r'''    public void start(){
        if(session!=null && session.isRunning()){
            terminalView.requestFocusFromTouch();
            terminalView.requestFocus();
            showKeyboard();
            return;
        }
        try{
            String script="R=/data/local/linux/rootfs; " +
                    "test -x \\\"$R/bin/bash\\\" || { echo '[METMC] Debian rootfs /bin/bash is missing.'; exit 1; }; " +
                    "mkdir -p \\\"$R/dev\\\" \\\"$R/dev/pts\\\" \\\"$R/proc\\\" \\\"$R/sys\\\" \\\"$R/tmp\\\" \\\"$R/run\\\"; " +
                    "mountpoint -q \\\"$R/dev\\\" 2>/dev/null || mount --bind /dev \\\"$R/dev\\\" 2>/dev/null || true; " +
                    "mountpoint -q \\\"$R/dev/pts\\\" 2>/dev/null || mount --bind /dev/pts \\\"$R/dev/pts\\\" 2>/dev/null || true; " +
                    "mountpoint -q \\\"$R/proc\\\" 2>/dev/null || mount -t proc proc \\\"$R/proc\\\" 2>/dev/null || true; " +
                    "mountpoint -q \\\"$R/sys\\\" 2>/dev/null || mount -t sysfs sys \\\"$R/sys\\\" 2>/dev/null || true; " +
                    "export PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin; " +
                    "export HOME=/root TERM=xterm-256color COLORTERM=truecolor LANG=C.UTF-8 LC_ALL=C.UTF-8 SHELL=/bin/bash; " +
                    "cd /root 2>/dev/null || cd /; " +
                    "exec chroot \\\"$R\\\" /bin/bash --login";
            String exe=null;
            String[] args=null;
            String[] magiskCandidates={
                    "/data/adb/magisk/magisk",
                    "/system/bin/magisk"
            };
            for(String candidate:magiskCandidates){
                java.io.File f=new java.io.File(candidate);
                if(f.isFile() && f.canExecute()){
                    exe=candidate;
                    args=new String[]{"su","-M","-c",script};
                    break;
                }
            }
            if(exe==null){
                String[] suCandidates={
                        "/data/adb/magisk/su",
                        "/debug_ramdisk/su",
                        "/sbin/su",
                        "/system/bin/su",
                        "/system/xbin/su",
                        "/system/product/bin/su",
                        "/system/sbin/su"
                };
                for(String candidate:suCandidates){
                    java.io.File f=new java.io.File(candidate);
                    if(f.isFile() && f.canExecute()){
                        exe=candidate;
                        args=new String[]{"-M","-c",script};
                        break;
                    }
                }
            }
            if(exe==null) throw new IOException("Magisk root entry point is unavailable. Grant root access to METMC OS NEXT in Magisk.");
            String[] env={
                    "TERM=xterm-256color","COLORTERM=truecolor","HOME=/root","LANG=C.UTF-8",
                    "LC_ALL=C.UTF-8","SHELL=/bin/bash",
                    "PATH=/data/adb/magisk:/debug_ramdisk:/sbin:/system/bin:/system/xbin:/system/product/bin:/usr/bin:/bin"
            };
            session=new TerminalSession(exe,"/",args,env,5000,new SessionClient());
            terminalView.attachSession(session);
            terminalView.setFocusableInTouchMode(true);
            terminalView.requestFocusFromTouch();
            terminalView.requestFocus();
            showKeyboard();
        }catch(Exception ex){
            session=null;
            android.util.Log.e("METMC","Terminal start failed",ex);
            removeAllViews();
            TextView fallback=new TextView(getContext());
            fallback.setText("METMC Terminal\\n\\nUnable to start the Debian terminal.\\n"+ex.getMessage());
            fallback.setTextColor(Color.WHITE);
            fallback.setTextSize(14);
            fallback.setPadding(24,24,24,24);
            addView(fallback,new LayoutParams(-1,-1));
        }
    }
'''
          s=s[:start]+new+s[end:]
          p.write_text(s)

          p=Path('app/src/main/java/com/metmc/os/next/MainActivity.java')
          s=p.read_text()
          s=s.replace('float windowScroll=0;\n        float applicationsWindowScroll=0;', 'float windowScroll=0;\n        float applicationsWindowScroll=0;\n        float filesWindowScroll=0;')
          s=s.replace('c.translate(0,-("Applications".equals(title) ? applicationsWindowScroll : windowScroll));', 'c.translate(0,-("Applications".equals(title) ? applicationsWindowScroll : ("Files".equals(title) ? filesWindowScroll : windowScroll)));')
          s=s.replace('float activeWindowScroll="Applications".equals(title) ? applicationsWindowScroll : windowScroll;', 'float activeWindowScroll="Applications".equals(title) ? applicationsWindowScroll : ("Files".equals(title) ? filesWindowScroll : windowScroll);')
          s=s.replace('float contentTop=files.t+128-windowScroll, contentBottom=files.b-12;', 'float contentTop=files.t+128-filesWindowScroll, contentBottom=files.b-12;')
          old='if("Applications".equals(scrollingWindowTitle)) applicationsWindowScroll=Math.max(0,Math.min(max,next)); else windowScroll=Math.max(0,Math.min(max,next));'
          new='if("Applications".equals(scrollingWindowTitle)) applicationsWindowScroll=Math.max(0,Math.min(max,next)); else if("Files".equals(scrollingWindowTitle)) filesWindowScroll=Math.max(0,Math.min(max,next)); else windowScroll=Math.max(0,Math.min(max,next));'
          s=s.replace(old,new)
          old='if("Applications".equals(scrollingWindowTitle)) applicationsWindowScroll=Math.max(0,Math.min(max,applicationsWindowScroll+dy)); else windowScroll=Math.max(0,Math.min(max,windowScroll+dy));'
          new='if("Applications".equals(scrollingWindowTitle)) applicationsWindowScroll=Math.max(0,Math.min(max,applicationsWindowScroll+dy)); else if("Files".equals(scrollingWindowTitle)) filesWindowScroll=Math.max(0,Math.min(max,filesWindowScroll+dy)); else windowScroll=Math.max(0,Math.min(max,windowScroll+dy));'
          s=s.replace(old,new)
          old='if("Applications".equals(hit.title)){\n                                applicationsWindowScroll=Math.max(0,Math.min(windowScrollMax(hit.title,hit),applicationsWindowScroll-delta*72f));\n                            }else{\n                                windowScroll=Math.max(0,Math.min(windowScrollMax(hit.title,hit),windowScroll-delta*72f));\n                            }'
          new='if("Applications".equals(hit.title)){\n                                applicationsWindowScroll=Math.max(0,Math.min(windowScrollMax(hit.title,hit),applicationsWindowScroll-delta*72f));\n                            }else if("Files".equals(hit.title)){\n                                filesWindowScroll=Math.max(0,Math.min(windowScrollMax(hit.title,hit),filesWindowScroll-delta*72f));\n                            }else{\n                                windowScroll=Math.max(0,Math.min(windowScrollMax(hit.title,hit),windowScroll-delta*72f));\n                            }'
          s=s.replace(old,new)
          s=s.replace('if("Applications".equals(hit.title)) applicationsWindowScroll=0;\n                            else windowScroll=0;', 'if("Applications".equals(hit.title)) applicationsWindowScroll=0;\n                            else if("Files".equals(hit.title)) filesWindowScroll=0;\n                            else windowScroll=0;')
          s=s.replace('if(!openWindows.contains(name)){ openWindows.add(name); if("Applications".equals(name)) applicationsWindowScroll=0; }', 'if(!openWindows.contains(name)){ openWindows.add(name); if("Applications".equals(name)) applicationsWindowScroll=0; else if("Files".equals(name)) filesWindowScroll=0; }')
          s=s.replace('return 174f+Math.max(1,(fileEntries.size()+cols-1)/cols)*72f+50f;', 'return 128f+Math.max(1,(fileEntries.size()+cols-1)/cols)*72f+42f;')
          p.write_text(s)
          PY
      - name: Commit source patch and remove temporary workflow
        run: |
          git config user.name 'METMC Auto Patch'
          git config user.email 'actions@github.com'
          git rm .github/workflows/apply-metmc-patch.yml
          git add app/src/main/java/com/metmc/os/next/MetmcTerminalPanel.java app/src/main/java/com/metmc/os/next/MainActivity.java
          git diff --cached --check
          git diff --cached --quiet && exit 0 || true
          git commit -m '[METMC AUTO PATCH] Fix Debian terminal root and native window scrolling'
          git push
