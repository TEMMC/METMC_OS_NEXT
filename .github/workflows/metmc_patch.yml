name: METMC one-time source patch
on:
  push:
    branches: [ main ]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message != '[METMC PATCH] Fix Debian terminal root and XFCE-style scrolling'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: |
          set -e
          python3 tools/metmc_patch_once.py
          rm tools/metmc_patch_once.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/metmc/os/next/MainActivity.java app/src/main/java/com/metmc/os/next/MetmcTerminalPanel.java app/build.gradle app/src/main/AndroidManifest.xml tools/metmc_patch_once.py
          git commit -m '[METMC PATCH] Fix Debian terminal root and XFCE-style scrolling'
          git push origin HEAD:main
