name: Build and Release METMC OS NEXT

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply one-time app menu and file manager stability patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/metmc/os/next/MainActivity.java')
          s=p.read_text()
          def method_body(src, needle):
              start=src.index(needle); brace=src.index('{', start); depth=0
              for i in range(brace, len(src)):
                  if src[i]=='{': depth+=1
                  elif src[i]=='}':
                      depth-=1
                      if depth==0: return start,i+1
              raise RuntimeError('unclosed '+needle)
          anchor='        final ArrayList<ResolveInfo> androidApps=new ArrayList<>();\n'
          field='        final java.util.HashMap<String,Drawable> androidIconCache=new java.util.HashMap<>();\n'
          if 'androidIconCache' not in s: s=s.replace(anchor,anchor+field,1)
          a,b=method_body(s,'void drawAndroidIcon(')
          s=s[:a]+'''        void drawAndroidIcon(Canvas c,float x,float y,ResolveInfo r){
            if(r==null){ drawAppIcon(c,x,y,"Android"); return; }
            String key=r.activityInfo.packageName+"/"+r.activityInfo.name;
            try{
                Drawable d=androidIconCache.get(key);
                if(d==null){ Drawable loaded=r.loadIcon(getPackageManager()); if(loaded!=null){ d=loaded.getConstantState()!=null?loaded.getConstantState().newDrawable():loaded; androidIconCache.put(key,d); } }
                if(d!=null){ c.save(); c.translate(x,y); d.setBounds(0,0,40,40); d.draw(c); c.restore(); return; }
            }catch(Throwable ex){ Log.w("METMC","Android icon failed",ex); }
            drawAppIcon(c,x,y,"Android");
        }'''+s[b:]
          a,b=method_body(s,'void drawApplicationsWindowContent(')
          s=s[:a]+'''        void drawApplicationsWindowContent(Canvas c,float l,float t,float r,float b){
            String[] n={"Files","Terminal","Browser","Settings","Media","Linux Apps"};
            float cw=(r-l-48)/3f, top=t+62, scroll=applicationsWindowScroll;
            int total=n.length+androidApps.size();
            int first=Math.max(0,(int)Math.floor((scroll-110f)/116f));
            int last=Math.min(total-1,(int)Math.ceil((scroll+(b-t)-54f)/116f)+1);
            c.save(); c.clipRect(l+12,t+54,r-12,b-12);
            for(int i=first;i<=last;i++){
                int col=i%3,row=i/3; float x=l+16+col*(cw+8), y=top+row*116-scroll;
                if(y+104<t+54||y>b-12) continue;
                round(c,x,y,x+cw,y+104,12,0xff151d27);
                if(i<n.length){ drawAppIcon(c,x+10,y+25,n[i]); bold(c,n[i],x+60,y+37,12,Color.WHITE); text(c,appSubtitle(n[i]),x+60,y+58,8,0xff8d9aab); text(c,"CLICK TO OPEN",x+60,y+78,7,0xff39ff88); }
                else { ResolveInfo ri=androidApps.get(i-n.length); String name=String.valueOf(ri.loadLabel(getPackageManager())); drawAndroidIcon(c,x+10,y+25,ri); bold(c,name,x+60,y+37,11,Color.WHITE); text(c,ri.activityInfo.packageName,x+60,y+58,7,0xff718093); text(c,"CLICK TO LAUNCH",x+60,y+78,7,0xff39ff88); }
            }
            c.restore();
        }'''+s[b:]
          a,b=method_body(s,'void drawFileWindowPreview(')
          s=s[:a]+'''        void drawFileWindowPreview(Canvas c,float l,float t,float r,float b){
            c.save(); c.clipRect(l+14,t+54,r-14,b-12);
            String displayPath=fileDirectory; if(displayPath.length()>58) displayPath="…"+displayPath.substring(displayPath.length()-57);
            text(c,displayPath,l+28,t+76,10,0xff9aaabd);
            round(c,l+24,t+86,l+82,t+116,8,0xff202b36); text(c,"UP",l+43,t+106,8,Color.WHITE);
            round(c,l+88,t+86,l+158,t+116,8,0xff294b39); text(c,"NEW",l+107,t+106,8,Color.WHITE);
            round(c,l+164,t+86,l+238,t+116,8,0xff202b36); text(c,"ZIP",l+188,t+106,8,Color.WHITE);
            round(c,l+244,t+86,l+318,t+116,8,0xff202b36); text(c,"SORT",l+263,t+106,8,Color.WHITE);
            round(c,l+324,t+86,l+408,t+116,8,showHiddenFiles?0xff294b39:0xff202b36); text(c,showHiddenFiles?"HIDDEN":"FILES",l+341,t+106,8,Color.WHITE);
            text(c,""+Math.max(0,fileEntries.size()-(fileParentDirectory!=null?1:0))+" items",l+416,t+106,9,0xff7f8d9f);
            float contentTop=t+128, available=Math.max(1,r-l-48); int columns=fileGridColumns(available); float gap=10f,tileW=(available-gap*(columns-1))/columns,tileH=62f,step=72f,scroll=windowScroll;
            ArrayList<String> entries=new ArrayList<>(fileEntries.values());
            int firstRow=Math.max(0,(int)Math.floor((scroll-74f)/step));
            int lastRow=Math.min((entries.size()+columns-1)/columns-1,(int)Math.ceil((scroll+(b-t)-140f)/step)+1);
            int first=Math.max(0,firstRow*columns), last=Math.min(entries.size()-1,(lastRow+1)*columns-1);
            for(int i=first;i<=last;i++){
                int col=i%columns,row=i/columns; float x=l+24+col*(tileW+gap), yy=contentTop+row*step-scroll;
                if(yy+tileH<t+54||yy>b-12) continue;
                round(c,x,yy,x+tileW,yy+tileH,12,0xff151f29); File f=new File(entries.get(i));
                drawAppIcon(c,x+10,yy+11,f.isDirectory()?"Files":(isArchiveFile(f)?"Linux Apps":"Browser"));
                String name=f.getName().isEmpty()?f.getAbsolutePath():f.getName(); if(entries.get(i).equals(fileParentDirectory)) name=".."; if(name.length()>22) name=name.substring(0,21)+"…";
                text(c,name,x+58,yy+26,10,0xffd6dfeb); text(c,f.isDirectory()?"FOLDER":formatFileSize(f.length()),x+58,yy+43,8,0xff7f9b8b);
            }
            c.restore();
        }'''+s[b:]
          p.write_text(s)
          PY

      - name: Commit stability patch and restore workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout HEAD^ -- .github/workflows/build.yml
          git add app/src/main/java/com/metmc/os/next/MainActivity.java .github/workflows/build.yml
          if git diff --cached --quiet; then echo "No stability changes"; exit 0; fi
          git commit -m "Stabilize app menu and file manager rendering"
          git push origin HEAD:main

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Check permanent signing configuration
        env:
          KEYSTORE_B64: ${{ secrets.METMC_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.METMC_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.METMC_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.METMC_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "SIGNING_READY=true" >> "$GITHUB_ENV"
          else
            echo "SIGNING_READY=false" >> "$GITHUB_ENV"
            echo "Permanent signing secrets are not configured; building a debug APK so CI still produces an installable artifact."
          fi

      - name: Build debug APK
        if: env.SIGNING_READY != 'true'
        run: gradle assembleDebug --no-daemon

      - name: Upload debug APK
        if: env.SIGNING_READY != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: METMC-OS-NEXT-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90

      - name: Restore permanent signing key
        if: env.SIGNING_READY == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.METMC_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > metmc-release.jks
          test -s metmc-release.jks

      - name: Build signed release APK
        if: env.SIGNING_READY == 'true'
        env:
          METMC_KEYSTORE_PASSWORD: ${{ secrets.METMC_KEYSTORE_PASSWORD }}
          METMC_KEY_ALIAS: ${{ secrets.METMC_KEY_ALIAS }}
          METMC_KEY_PASSWORD: ${{ secrets.METMC_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Prepare signed release
        if: env.SIGNING_READY == 'true'
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk release/METMC-OS-NEXT.apk

      - name: Verify install-ready APK
        if: env.SIGNING_READY == 'true'
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          APK="release/METMC-OS-NEXT.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          "$BUILD_TOOLS/zipalign" -c -P 16 -v 4 "$APK" >/dev/null
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/apksigner.txt
          grep -Eq "Verified using v2 scheme \(APK Signature Scheme v2\): true|Verified using v3 scheme \(APK Signature Scheme v3\): true|Verified using v3.1 scheme \(APK Signature Scheme v3.1\): true" /tmp/apksigner.txt
          grep -Fq "96423871687134af5d779c1cb33c36c2fd0fdb145c50e34663a291e535d24294" /tmp/apksigner.txt
          "$BUILD_TOOLS/aapt2" dump badging "$APK" | grep -Fq "package: name='com.metmc.os.next'"
          echo "METMC OS NEXT APK passed integrity, alignment, v2-or-newer signing, certificate and package checks."

      - name: Upload signed release artifact
        if: env.SIGNING_READY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: METMC-OS-NEXT-release
          path: release/METMC-OS-NEXT.apk
          retention-days: 90

      - name: Publish GitHub release
        if: env.SIGNING_READY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION_NAME=$(grep -m1 "versionName" app/build.gradle | sed -E "s/.*versionName ['\"]([^'\"]+)['\"].*/\\1/")
          test -n "$VERSION_NAME"
          TAG="v${VERSION_NAME}-build.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" release/METMC-OS-NEXT.apk --title "METMC OS NEXT $TAG" --notes "Automatic METMC OS NEXT release from commit ${GITHUB_SHA}. Every successful signed push is published as its own release."
