name: Build and Release METMC OS NEXT

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Check permanent signing configuration
        env:
          KEYSTORE_B64: ${{ secrets.METMC_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.METMC_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.METMC_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.METMC_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "SIGNING_READY=true" >> "$GITHUB_ENV"
          else
            echo "SIGNING_READY=false" >> "$GITHUB_ENV"
            echo "Permanent signing secrets are not configured; building a debug APK so CI still produces an installable artifact."
          fi

      - name: Build debug APK
        if: env.SIGNING_READY != 'true'
        run: gradle assembleDebug --no-daemon

      - name: Upload debug APK
        if: env.SIGNING_READY != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: METMC-OS-NEXT-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90

      - name: Restore permanent signing key
        if: env.SIGNING_READY == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.METMC_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > metmc-release.jks
          test -s metmc-release.jks

      - name: Build signed release APK
        if: env.SIGNING_READY == 'true'
        env:
          METMC_KEYSTORE_PASSWORD: ${{ secrets.METMC_KEYSTORE_PASSWORD }}
          METMC_KEY_ALIAS: ${{ secrets.METMC_KEY_ALIAS }}
          METMC_KEY_PASSWORD: ${{ secrets.METMC_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Prepare signed release
        if: env.SIGNING_READY == 'true'
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk release/METMC-OS-NEXT.apk

      - name: Verify APK signature
        if: env.SIGNING_READY == 'true'
        run: |
          $ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner verify --verbose release/METMC-OS-NEXT.apk

      - name: Upload signed release artifact
        if: env.SIGNING_READY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: METMC-OS-NEXT-release
          path: release/METMC-OS-NEXT.apk
          retention-days: 90

      - name: Publish GitHub release
        if: env.SIGNING_READY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION_NAME=$(sed -n "s/.*versionName ['\\"]\\([^'\\"]*\\)['\\"] .*/\\1/p" app/build.gradle | head -1)
          if [ -z "$VERSION_NAME" ]; then
            VERSION_NAME=$(sed -n "s/.*versionName ['\\"]\\([^'\\"]*\\)['\\"].*/\\1/p" app/build.gradle | head -1)
          fi
          test -n "$VERSION_NAME"
          TAG="v$VERSION_NAME"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" release/METMC-OS-NEXT.apk --title "METMC OS NEXT $TAG" --notes "Signed METMC OS NEXT release. Permanent signing key is reused for future updates."
