name: Build and Release METMC OS NEXT

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # BEGIN ONE-TIME SOURCE REPAIR
      - name: Normalize checked-in source
        run: |
          python3 <<'PY'
          from pathlib import Path

          main = Path('app/src/main/java/com/metmc/os/next/MainActivity.java')
          s = main.read_text()
          old = '''        PackageManager pm = getPackageManager();
          LinkedHashMap<String,ResolveInfo> found = new LinkedHashMap<>();
          launcher.addCategory(Intent.CATEGORY_LAUNCHER);'''
          new = '''        PackageManager pm = getPackageManager();
          LinkedHashMap<String,ResolveInfo> found = new LinkedHashMap<>();
          Intent launcher = new Intent(Intent.ACTION_MAIN);
          launcher.addCategory(Intent.CATEGORY_LAUNCHER);'''
          if old in s:
              s = s.replace(old, new, 1)
          s = s.replace('pm.queryIntentActivities(launcher, PackageManager.MATCH_DEFAULT_ONLY)',
                        'pm.queryIntentActivities(launcher, PackageManager.MATCH_ALL)')

          old = '''                        if(y>hit.t+54 && y<hit.b-12 && windowScrollMax(hit.title,hit)>0){
                            scrollingWindowTitle=hit.title;
                        }'''
          new = '''                        if(y>hit.t+54 && y<hit.b-12 && windowScrollMax(hit.title,hit)>0){
                            scrollingWindowTitle=hit.title;
                        }
                        if(("Applications".equals(hit.title) || "Files".equals(hit.title))
                                && y>hit.t+54 && y<hit.b-12 && windowScrollMax(hit.title,hit)>0){
                            scrollingWindowTitle=hit.title;
                        }'''
          if old in s:
              s = s.replace(old, new, 1)

          marker = '''        WindowState windowAt(float x,float y){'''
          method = '''        @Override public boolean onGenericMotionEvent(MotionEvent event){
            try{
                if(event.getAction()==MotionEvent.ACTION_SCROLL){
                    float x=event.getX(), y=event.getY();
                    WindowState hit=windowAt(x,y);
                    if(hit!=null && windowScrollMax(hit.title,hit)>0){
                        float delta=event.getAxisValue(MotionEvent.AXIS_VSCROLL);
                        if(Math.abs(delta)>0.01f){
                            if("Applications".equals(hit.title)){
                                applicationsWindowScroll=Math.max(0,Math.min(windowScrollMax(hit.title,hit),applicationsWindowScroll-delta*72f));
                            }else{
                                windowScroll=Math.max(0,Math.min(windowScrollMax(hit.title,hit),windowScroll-delta*72f));
                            }
                            bringToFront(hit.title);
                            invalidate();
                            return true;
                        }
                    }
                }
            }catch(Throwable ex){ Log.w("METMC","Generic scroll failed",ex); }
            return super.onGenericMotionEvent(event);
        }

'''
          if marker in s and 'onGenericMotionEvent(MotionEvent event)' not in s:
              s = s.replace(marker, method + marker, 1)
          main.write_text(s)

          panel = Path('app/src/main/java/com/metmc/os/next/MetmcTerminalPanel.java')
          p = panel.read_text()
          old = '''            String script="SU=; " +
                    "for C in /debug_ramdisk/su /sbin/su /system/bin/su /system/xbin/su; do " +'''
          new = '''            String script="SU=; " +
                    "for C in /debug_ramdisk/su /sbin/su /system/bin/su /system/xbin/su /system/sbin/su; do " +'''
          if old in p:
              p = p.replace(old, new, 1)
          old = '''                    "if [ -z \"$SU\" ] && command -v su >/dev/null 2>&1; then SU=\"$(command -v su)\"; fi; " +
                    "if [ -z \"$SU\" ]; then echo '[METMC] Magisk su was not exposed to this process.'; exit 1; fi; " +'''
          new = '''                    "if [ -z \"$SU\" ] && [ -x /system/bin/magisk ]; then MT=\"$(/system/bin/magisk --path 2>/dev/null)\"; [ -x \"$MT/su\" ] && SU=\"$MT/su\"; fi; " +
                    "if [ -z \"$SU\" ] && command -v su >/dev/null 2>&1; then SU=\"$(command -v su)\"; fi; " +
                    "if [ -z \"$SU\" ]; then echo '[METMC] Magisk su is not exposed to METMC OS NEXT. Grant root access to METMC OS NEXT in Magisk, then reopen Terminal.'; exit 1; fi; " +'''
          if old in p:
              p = p.replace(old, new, 1)
          old = '''        terminalView.setFocusable(true);
        terminalView.setFocusableInTouchMode(true);
    }'''
          new = '''        terminalView.setFocusable(true);
        terminalView.setFocusableInTouchMode(true);
        terminalView.setEnabled(true);
        terminalView.setClickable(true);
        terminalView.setOnTouchListener((v,e)->{
            if(e.getAction()==MotionEvent.ACTION_DOWN || e.getAction()==MotionEvent.ACTION_UP){
                v.setFocusableInTouchMode(true);
                v.requestFocusFromTouch();
                v.requestFocus();
            }
            return false;
        });
    }'''
          if old in p:
              p = p.replace(old, new, 1)
          panel.write_text(p)

          gradle = Path('app/build.gradle')
          g = gradle.read_text()
          start = g.find('// Keep the current MainActivity source compatible')
          end = g.find("dependencies {", start)
          if start >= 0 and end > start:
              g = g[:start] + g[end:]
          gradle.write_text(g)
          PY

          python3 <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/build.yml')
          s=p.read_text()
          a=s.find('      # BEGIN ONE-TIME SOURCE REPAIR')
          b=s.find('      # END ONE-TIME SOURCE REPAIR')
          if a >= 0 and b >= a:
              b=s.find('\n', b)
              s=s[:a]+s[b+1:]
          p.write_text(s)
          PY

      - name: Commit normalized source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/metmc/os/next/MainActivity.java app/src/main/java/com/metmc/os/next/MetmcTerminalPanel.java app/build.gradle .github/workflows/build.yml
          if git diff --cached --quiet; then
            echo "Source already normalized."
          else
            git commit -m "Fix terminal root startup and native window scrolling"
            git push origin HEAD:main
          fi
      # END ONE-TIME SOURCE REPAIR

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Check permanent signing configuration
        env:
          KEYSTORE_B64: ${{ secrets.METMC_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.METMC_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.METMC_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.METMC_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "SIGNING_READY=true" >> "$GITHUB_ENV"
          else
            echo "SIGNING_READY=false" >> "$GITHUB_ENV"
            echo "Permanent signing secrets are not configured; building a debug APK so CI still produces an installable artifact."
          fi

      - name: Build debug APK
        if: env.SIGNING_READY != 'true'
        run: gradle assembleDebug --no-daemon

      - name: Upload debug APK
        if: env.SIGNING_READY != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: METMC-OS-NEXT-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90

      - name: Restore permanent signing key
        if: env.SIGNING_READY == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.METMC_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > metmc-release.jks
          test -s metmc-release.jks

      - name: Build signed release APK
        if: env.SIGNING_READY == 'true'
        env:
          METMC_KEYSTORE_PASSWORD: ${{ secrets.METMC_KEYSTORE_PASSWORD }}
          METMC_KEY_ALIAS: ${{ secrets.METMC_KEY_ALIAS }}
          METMC_KEY_PASSWORD: ${{ secrets.METMC_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Prepare signed release
        if: env.SIGNING_READY == 'true'
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk release/METMC-OS-NEXT.apk

      - name: Verify install-ready APK
        if: env.SIGNING_READY == 'true'
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          APK="release/METMC-OS-NEXT.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          "$BUILD_TOOLS/zipalign" -c -P 16 -v 4 "$APK" >/dev/null
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/apksigner.txt
          grep -Eq "Verified using v2 scheme \(APK Signature Scheme v2\): true|Verified using v3 scheme \(APK Signature Scheme v3\): true|Verified using v3.1 scheme \(APK Signature Scheme v3.1\): true" /tmp/apksigner.txt
          grep -Fq "96423871687134af5d779c1cb33c36c2fd0fdb145c50e34663a291e535d24294" /tmp/apksigner.txt
          "$BUILD_TOOLS/aapt2" dump badging "$APK" | grep -Fq "package: name='com.metmc.os.next'"
          echo "METMC OS NEXT APK passed integrity, alignment, v2-or-newer signing, certificate and package checks."

      - name: Upload signed release artifact
        if: env.SIGNING_READY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: METMC-OS-NEXT-release
          path: release/METMC-OS-NEXT.apk
          retention-days: 90

      - name: Publish GitHub release
        if: env.SIGNING_READY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION_NAME=$(grep -m1 "versionName" app/build.gradle | sed -E "s/.*versionName ['\"]([^'\"]+)['\"].*/\\1/")
          test -n "$VERSION_NAME"
          TAG="v${VERSION_NAME}-build.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" release/METMC-OS-NEXT.apk --title "METMC OS NEXT $TAG" --notes "Automatic METMC OS NEXT release from commit ${GITHUB_SHA}. Every successful signed push is published as its own release."
