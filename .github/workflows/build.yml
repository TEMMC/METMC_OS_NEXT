name: Build and Release METMC OS NEXT

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Prepare release APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/METMC-OS-NEXT.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: METMC-OS-NEXT
          path: release/METMC-OS-NEXT.apk
          retention-days: 90

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.0"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" release/METMC-OS-NEXT.apk \
            --title "METMC OS NEXT v1.0.0" \
            --notes "METMC OS NEXT native Android desktop build from $GITHUB_SHA."
