name: Build and Release METMC OS NEXT

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Build release APK
        run: gradle assembleRelease --no-daemon

      - name: Collect APKs
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/METMC-OS-NEXT-debug.apk
          if [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk release/METMC-OS-NEXT-unsigned.apk
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: METMC-OS-NEXT
          path: release/*.apk
          retention-days: 90

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="nightly"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" release/*.apk             --title "METMC OS NEXT Nightly"             --notes "Automated METMC OS NEXT build from $GITHUB_SHA."             --prerelease
