name: Build and Release METMC OS NEXT

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Check permanent signing configuration
        env:
          KEYSTORE_B64: ${{ secrets.METMC_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.METMC_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.METMC_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.METMC_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "SIGNING_READY=true" >> "$GITHUB_ENV"
          else
            echo "SIGNING_READY=false" >> "$GITHUB_ENV"
            echo "Permanent signing secrets are not configured; building a debug APK so CI still produces an installable artifact."
          fi

      - name: Build debug APK
        if: env.SIGNING_READY != 'true'
        run: gradle assembleDebug --no-daemon

      - name: Upload debug APK
        if: env.SIGNING_READY != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: METMC-OS-NEXT-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90

      - name: Restore permanent signing key
        if: env.SIGNING_READY == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.METMC_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > metmc-release.jks
          test -s metmc-release.jks

      - name: Build signed release APK
        if: env.SIGNING_READY == 'true'
        env:
          METMC_KEYSTORE_PASSWORD: ${{ secrets.METMC_KEYSTORE_PASSWORD }}
          METMC_KEY_ALIAS: ${{ secrets.METMC_KEY_ALIAS }}
          METMC_KEY_PASSWORD: ${{ secrets.METMC_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Prepare signed release
        if: env.SIGNING_READY == 'true'
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk release/METMC-OS-NEXT.apk

      - name: Finalize and verify install-ready APK
        if: env.SIGNING_READY == 'true'
        env:
          METMC_KEYSTORE_PASSWORD: ${{ secrets.METMC_KEYSTORE_PASSWORD }}
          METMC_KEY_ALIAS: ${{ secrets.METMC_KEY_ALIAS }}
          METMC_KEY_PASSWORD: ${{ secrets.METMC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          APK="release/METMC-OS-NEXT.apk"
          ALIGNED="release/METMC-OS-NEXT-aligned.apk"
          SIGNED="release/METMC-OS-NEXT-final.apk"
          test -s "$APK"
          "$BUILD_TOOLS/zipalign" -P 16 -f 4 "$APK" "$ALIGNED"
          "$BUILD_TOOLS/apksigner" sign             --ks metmc-release.jks             --ks-pass env:METMC_KEYSTORE_PASSWORD             --ks-key-alias "$METMC_KEY_ALIAS"             --key-pass env:METMC_KEY_PASSWORD             --v1-signing-enabled true             --v2-signing-enabled true             --v3-signing-enabled true             --out "$SIGNED" "$ALIGNED"
          "$BUILD_TOOLS/zipalign" -c -P 16 -v 4 "$SIGNED" >/dev/null
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$SIGNED" | tee /tmp/apksigner.txt
          grep -Fq "Verified using v2 scheme (APK Signature Scheme v2): true" /tmp/apksigner.txt
          grep -Fq "Verified using v3 scheme (APK Signature Scheme v3): true" /tmp/apksigner.txt
          grep -Fq "96423871687134af5d779c1cb33c36c2fd0fdb145c50e34663a291e535d24294" /tmp/apksigner.txt
          "$BUILD_TOOLS/aapt2" dump badging "$SIGNED" | grep -Fq "package: name='com.metmc.os.next'"
          mv "$SIGNED" "$APK"
          rm -f "$ALIGNED"
          echo "Final METMC OS NEXT APK passed ZIP alignment, v2/v3 signing, certificate and package checks."

      - name: Upload signed release artifact
        if: env.SIGNING_READY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: METMC-OS-NEXT-release
          path: release/METMC-OS-NEXT.apk
          retention-days: 90

      - name: Publish GitHub release
        if: env.SIGNING_READY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION_NAME=$(grep -m1 "versionName" app/build.gradle | sed -E "s/.*versionName ['\"]([^'\"]+)['\"].*/\\1/")
          test -n "$VERSION_NAME"
          TAG="v${VERSION_NAME}-build.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" release/METMC-OS-NEXT.apk --title "METMC OS NEXT $TAG" --notes "Automatic METMC OS NEXT release from commit ${GITHUB_SHA}. Every successful signed push is published as its own release."
