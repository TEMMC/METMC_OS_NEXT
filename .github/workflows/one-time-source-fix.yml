name: One-time METMC source fix

on: push

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Patch MainActivity compiler error
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/metmc/os/next/MainActivity.java')
          s = p.read_text()
          old = '''    ArrayList<ResolveInfo> getAndroidApps() {
        PackageManager pm = getPackageManager();
        LinkedHashMap<String,ResolveInfo> found = new LinkedHashMap<>();
        launcher.addCategory(Intent.CATEGORY_LAUNCHER);'''
          new = '''    ArrayList<ResolveInfo> getAndroidApps() {
        PackageManager pm = getPackageManager();
        LinkedHashMap<String,ResolveInfo> found = new LinkedHashMap<>();
        Intent launcher = new Intent(Intent.ACTION_MAIN);
        launcher.addCategory(Intent.CATEGORY_LAUNCHER);'''
          if old not in s:
              raise SystemExit('Expected getAndroidApps block was not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Commit source fix and remove one-time workflow
        run: |
          git config user.name "TEMMC"
          git config user.email "mapfumotinotendaenock9@gmail.com"
          git add app/src/main/java/com/metmc/os/next/MainActivity.java
          git rm .github/workflows/one-time-source-fix.yml
          git commit -m "Patch METMC source: restore launcher declaration"
          git push origin main
